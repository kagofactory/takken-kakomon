<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>お問い合わせ｜宅建過去問ラボ</title>
<meta name="description" content="宅建過去問ラボへのお問い合わせフォームです。問題・解説の誤りの報告やご意見をお寄せください。">
<meta name="robots" content="noindex">
<link rel="canonical" href="https://takken-kakomon.jp/contact.html">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="css/style.css">
<style>
  .contact-form label { display: block; font-weight: bold; margin: 16px 0 6px; }
  .contact-form .req { color: #b3261e; font-size: 0.85rem; margin-left: 4px; }
  .contact-form input[type="text"],
  .contact-form input[type="email"],
  .contact-form select,
  .contact-form textarea {
    width: 100%; box-sizing: border-box; padding: 10px 12px; font-size: 1rem;
    border: 1px solid var(--border); border-radius: 8px; background: #fff; font-family: inherit;
  }
  .contact-form textarea { min-height: 180px; resize: vertical; }
  .contact-form .hp { position: absolute; left: -9999px; height: 0; overflow: hidden; }
  .contact-form button { margin-top: 20px; min-height: 44px; border: 0; cursor: pointer; font-size: 1rem; }
  .contact-form button:disabled { opacity: 0.6; cursor: default; }
  .contact-msg { margin-top: 16px; padding: 12px 14px; border-radius: 8px; display: none; }
  .contact-msg.ok { display: block; background: #e8f5ee; color: #1b5e42; }
  .contact-msg.ng { display: block; background: #fdecea; color: #b3261e; }
</style>
</head>
<body>

<header class="site-header">
  <h1><a href="index.html">宅建過去問ラボ</a></h1>
</header>

<main>
  <nav class="breadcrumb"><a href="index.html">トップ</a> &gt; お問い合わせ</nav>

  <div class="card">
    <h2>お問い合わせ</h2>
    <p>問題・解説の誤りの報告や、ご意見・ご要望をお寄せください。お名前はペンネームでも構いません。</p>
    <p style="font-size:0.88rem;color:var(--muted);">
      ※ 個別の法律相談にはお答えできません。<br>
      ※ すべてのお問い合わせに返信できるとは限りません。<br>
      ※ ご入力いただいた内容は、お問い合わせへの対応以外には使用しません（詳しくは<a href="privacy.html">プライバシーポリシー</a>をご覧ください）。
    </p>

    <form id="contact-form" class="contact-form" novalidate>
      <input type="hidden" name="access_key" value="9a28716c-0fb3-4c5b-b2a1-c3f7dba486f7">
      <input type="hidden" name="subject" value="【宅建過去問ラボ】お問い合わせ">
      <input type="hidden" name="from_name" value="宅建過去問ラボ お問い合わせフォーム">
      <div class="hp" aria-hidden="true">
        <label for="botcheck">この欄は入力しないでください</label>
        <input type="checkbox" id="botcheck" name="botcheck" tabindex="-1" autocomplete="off">
      </div>

      <label for="f-name">お名前（ペンネーム可）</label>
      <input type="text" id="f-name" name="name" maxlength="100" autocomplete="name">

      <label for="f-email">メールアドレス<span class="req">必須</span></label>
      <input type="email" id="f-email" name="email" maxlength="200" required autocomplete="email">

      <label for="f-type">お問い合わせの種類<span class="req">必須</span></label>
      <select id="f-type" name="種類" required>
        <option value="">選択してください</option>
        <option value="誤りの報告">誤りの報告</option>
        <option value="ご意見・ご要望">ご意見・ご要望</option>
        <option value="その他">その他</option>
      </select>

      <label for="f-message">お問い合わせ内容<span class="req">必須</span></label>
      <textarea id="f-message" name="message" maxlength="3000" required></textarea>
      <p style="font-size:0.82rem;color:var(--muted);margin:6px 0 0;">誤りの報告の場合は、該当する問題（年度・問番号）をご記入ください。</p>

      <button type="submit" class="btn btn-primary" id="f-submit">送信する</button>
      <div id="f-msg" class="contact-msg" role="status" aria-live="polite"></div>
    </form>
  </div>
</main>

<footer class="site-footer">
  <p>非公式の個人学習用サイトです。</p>
  <p class="footer-links"><a href="terms.html">利用規約</a> ・ <a href="privacy.html">プライバシーポリシー</a> ・ <a href="updates.html">更新履歴</a> ・ <a href="contact.html">お問い合わせ</a></p>
</footer>

<script>
(function () {
  var form = document.getElementById('contact-form');
  var btn = document.getElementById('f-submit');
  var msg = document.getElementById('f-msg');

  function show(cls, text) { msg.className = 'contact-msg ' + cls; msg.textContent = text; }

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var email = form.email.value.trim();
    var type = form['種類'].value;
    var message = form.message.value.trim();
    if (!email || !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) { show('ng', 'メールアドレスを正しく入力してください。'); form.email.focus(); return; }
    if (!type) { show('ng', 'お問い合わせの種類を選んでください。'); form['種類'].focus(); return; }
    if (!message) { show('ng', 'お問い合わせ内容を入力してください。'); form.message.focus(); return; }

    btn.disabled = true;
    btn.textContent = '送信中…';
    msg.className = 'contact-msg';

    var data = {};
    new FormData(form).forEach(function (v, k) { data[k] = v; });
    data.name = (data.name || '').trim() || '（未記入）';

    fetch('https://api.web3forms.com/submit', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
      body: JSON.stringify(data)
    }).then(function (r) { return r.json(); }).then(function (res) {
      if (res.success) {
        form.reset();
        show('ok', '送信しました。お問い合わせありがとうございます。');
      } else {
        show('ng', '送信に失敗しました。時間をおいて再度お試しください。');
      }
    }).catch(function () {
      show('ng', '送信に失敗しました。通信環境をご確認のうえ、再度お試しください。');
    }).then(function () {
      btn.disabled = false;
      btn.textContent = '送信する';
    });
  });
})();
</script>

</body>
</html>
